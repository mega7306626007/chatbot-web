<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <h1>Chatbot</h1>
    </header>

    <div id="chat-window" class="chat-window" aria-live="polite" role="log">
      <div class="message bot">
        <span class="bubble">Hi! Ask me anything.</span>
      </div>
    </div>

    <form id="chat-form" class="chat-form">
      <label for="user-input" class="sr-only">Type your message</label>
      <input
        type="text"
        id="user-input"
        name="message"
        placeholder="Type a message..."
        autocomplete="off"
        required
      >
      <button type="submit" id="send-btn">&#10148;</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
